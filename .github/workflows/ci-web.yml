name: CI & Deploy Web (Cloudflare Static Assets)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Avoid an outdated commit finishing its deployment after a newer push.
concurrency:
  group: velvetmotion-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://velvetmotion-ai.hampusi97.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit companion portraits and metadata
        run: npm run audit:companions

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      # A preview is optional when secrets are absent (e.g. forked PRs).
      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      # A production push MUST never appear successful when deployment was skipped.
      - name: Verify Cloudflare credentials for production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Automatic production deploy is not active. Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Automatically deploy every successful main commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify the commit served by production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          expected_sha="${GITHUB_SHA:0:7}"
          for attempt in {1..6}; do
            if metadata=$(curl --fail --silent --show-error --max-time 10 \
                "${PRODUCTION_URL}/build-meta.json?commit=${GITHUB_SHA}&attempt=${attempt}") &&
              deployed_sha=$(jq -er '.commitSha | strings' <<< "$metadata") &&
              [ "$deployed_sha" = "$expected_sha" ]; then
              echo "Production is serving commit $deployed_sha."
              exit 0
            fi
            echo "Production commit $expected_sha not visible yet (attempt $attempt/6)."
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Could not verify production commit $expected_sha at ${PRODUCTION_URL}/build-meta.json."
          exit 1

      - name: Record the deployed commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "### VelvetMotion automatic website deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: ${PRODUCTION_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production build metadata matched this commit after deployment." >> "$GITHUB_STEP_SUMMARY"
