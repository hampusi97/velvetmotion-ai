name: CI & Deploy Web (Cloudflare Static Assets)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Avoid an outdated commit finishing its deployment after a newer push.
concurrency:
  group: velvetmotion-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit companion portraits and metadata
        run: npm run audit:companions

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Validate Cloudflare Git deployment verifier
        run: node --test scripts/verify-cloudflare-git-deploy.test.mjs

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      # A preview is optional when secrets are absent (e.g. forked PRs).
      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      # Cloudflare's own GitHub integration already deploys this Worker and Pages.
      # If a second Wrangler deployment is not configured, verify the provider's
      # completed success check for *this exact SHA* instead of falsely failing CI.
      # This is not satisfied by a passing build, a preview, or a previous deploy.
      - name: Verify native Cloudflare Git deployment without Wrangler secrets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CF_TOKEN == '' && env.CF_ACCOUNT == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-cloudflare-git-deploy.mjs

      - name: Reject incomplete Wrangler credential configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ((env.CF_TOKEN != '' && env.CF_ACCOUNT == '') || (env.CF_TOKEN == '' && env.CF_ACCOUNT != ''))
        run: |
          echo "::error::Only one Cloudflare Wrangler credential is configured. Add both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID or leave both unset for native Git deployment."
          exit 1

      - name: Automatically deploy with Wrangler only when both credentials are present
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Record direct Wrangler deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        run: |
          echo "### VelvetMotion automatic website deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: https://velvetmotion-ai.hampusi97.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment was performed only after audit, lint, TypeScript and build passed." >> "$GITHUB_STEP_SUMMARY"
