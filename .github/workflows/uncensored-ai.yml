name: Uncensored AI Integration

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task prompt OR <<<FILE: path>>> blocks pasted from an external uncensored AI website"
        required: true
        default: "Search the web or inspect the repo and write a clean utility function."
        type: string
      target_file:
        description: "Default file path to write the agent's response summary to"
        required: false
        default: "answer.txt"
        type: string
      create_pr:
        description: "Open a Pull Request instead of committing directly to main"
        required: false
        default: false
        type: boolean
      model:
        description: "OpenRouter model ID (when UNCENSORED_AI_API_KEY or OPENROUTER_API_KEY secret is set)"
        required: false
        default: "cognitivecomputations/dolphin-mistral-24b-venice-edition:free"
        type: string
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  query-uncensored-ai:
    name: Run Autonomous AI Coding Agent
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner && github.event_name == 'issues') ||
      (github.actor == github.repository_owner && github.event_name == 'issue_comment' &&
       (startsWith(github.event.comment.body, '/ai ') || startsWith(github.event.comment.body, '@ai ')))
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run autonomous multi-tool agent (web_search, fetch_url, read/write code)
        env:
          UNCENSORED_AI_API_KEY: ${{ secrets.UNCENSORED_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VELVETMOTION_AGENT_MODEL: ${{ inputs.model }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_TARGET_FILE: ${{ inputs.target_file }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from src.agent import resolve_safe_path, run_agent_task, write_file

          event_name = os.environ.get("EVENT_NAME", "workflow_dispatch")
          if event_name == "issue_comment":
              raw = os.environ.get("COMMENT_BODY", "")
              for prefix in ("/ai ", "@ai "):
                  if raw.startswith(prefix):
                      raw = raw[len(prefix):]
                      break
              prompt = raw
          elif event_name == "issues":
              prompt = f"Issue: {os.environ.get('ISSUE_TITLE', '')}\n\n{os.environ.get('ISSUE_BODY', '')}"
          else:
              prompt = os.environ.get("INPUT_PROMPT", "")

          target_file = (os.environ.get("INPUT_TARGET_FILE") or "answer.txt").strip()
          try:
              resolve_safe_path(".", target_file)
          except ValueError:
              target_file = "answer.txt"

          result = run_agent_task(prompt, workspace_root=".", max_steps=3)
          write_file(".", target_file, result.response + ("\n" if not result.response.endswith("\n") else ""))
          if target_file != "answer.txt":
              write_file(".", "answer.txt", result.response + ("\n" if not result.response.endswith("\n") else ""))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## Autonomous AI Coding Agent Result\n")
                  fh.write(f"- **Provider Tier:** `{result.provider}`\n")
                  fh.write(f"- **Output File:** `{target_file}`\n")
                  if result.modified_files:
                      fh.write(f"- **Modified Files:** `{', '.join(result.modified_files)}`\n")
                  if result.tool_logs:
                      fh.write("- **Tool Calls Executed:**\n")
                      for entry in result.tool_logs:
                          fh.write(f"  - `{entry}`\n")
                  fh.write("\n### Agent Output\n\n")
                  fh.write(result.response + "\n")
          PY

      - name: Reply on GitHub Issue or Pull Request
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file answer.txt

      - name: Commit or open Pull Request with agent changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_PR: ${{ inputs.create_pr }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          if [ "${CREATE_PR:-false}" = "true" ]; then
            BRANCH="ai/agent-${GITHUB_RUN_ID}"
            git checkout -b "$BRANCH"
            git commit -m "AI Autonomous Agent: apply code updates"
            git push -u origin "$BRANCH"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "AI Autonomous Agent: apply code updates (run ${GITHUB_RUN_ID})" \
              --body-file answer.txt
          else
            git commit -m "Added AI response"
            git push origin HEAD:main
          fi
