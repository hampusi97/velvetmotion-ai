name: Automatic VelvetMotion Desktop Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional explicit version, e.g. v1.2.3 (blank = next patch)'
        required: false

# Never ship two "latest" releases simultaneously or in the wrong order.
concurrency:
  group: velvetmotion-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculate the next desktop version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ github.event.inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "$MANUAL_TAG" ]]; then
            TAG="$MANUAL_TAG"
          else
            # Increment the highest published/draft desktop patch release.
            TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' || true)
            export VM_EXISTING_RELEASE_TAGS="$TAGS"
            TAG=$(node - <<'JS'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const versions = [pkg.version, ...(process.env.VM_EXISTING_RELEASE_TAGS || '').split(/\s+/)]
            .map(v => /^v?(\d+)\.(\d+)\.(\d+)$/.exec(v || ''))
            .filter(Boolean)
            .map(m => [Number(m[1]), Number(m[2]), Number(m[3])]);
          versions.sort((a, b) => b[0]-a[0] || b[1]-a[1] || b[2]-a[2]);
          const [major, minor, patch] = versions[0] || [1,0,0];
          process.stdout.write(`v${major}.${minor}.${patch + 1}`);
          JS
            )
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Preparing automatic desktop release $TAG"

      # The parallel OS jobs must never race to create separate draft releases
      # under the same tag. Establish exactly one draft in the prepare job.
      - name: Create one draft release before parallel platform uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$DRAFT" != "true" ]]; then
              echo "::error::Release $TAG is already published; refusing to overwrite it."
              exit 1
            fi
            echo "Reusing existing draft release $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" \
              --title "VelvetMotion Desktop $TAG" \
              --notes "Automatically built from GitHub main. Unsigned installers are published only after four-platform validation; signed automatic updates require configured Tauri updater keys."
            echo "Created draft release $TAG before starting OS matrix."
          fi

  publish-tauri:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install dependencies and synchronize release version
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/bump-version.mjs "${{ needs.prepare.outputs.version }}"
          npm run audit:companions
          npm run build

      - name: Enable cryptographically signed in-app updates only when keys exist
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" && -z "$TAURI_UPDATER_PUBKEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Desktop installers will publish automatically, but in-app updates need TAURI_SIGNING_PRIVATE_KEY (secret) and TAURI_UPDATER_PUBKEY (repo variable)."
          elif [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_UPDATER_PUBKEY" ]]; then
            echo "::error::Partial updater signing configuration. Add both private key secret and public key variable, or remove both."
            exit 1
          else
            node scripts/prepare-signed-updater.mjs
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload installers to a draft GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'VelvetMotion Desktop ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'Automatically built from GitHub main after frontend and native validation. Desktop app bundles the interface; local model weights are separate. In-app automatic installation is available only when a signed updater has been configured.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.enabled == 'true' }}
          args: ${{ matrix.args }} ${{ steps.signing.outputs.enabled == 'true' && '--features signed-updater' || '' }}

  publish-release:
    needs: [prepare, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release verification script
        uses: actions/checkout@v4

      - name: Test fail-closed desktop publication gate
        run: node --test scripts/verify-desktop-release.test.mjs scripts/verify-desktop-release-with-retry.test.mjs

      - name: Reconcile multi-platform latest.json from uploaded .sig assets
        if: vars.TAURI_UPDATER_PUBKEY != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --pattern "latest.json" --dir "$TMP_DIR" --clobber || true
          node - "$TMP_DIR" "$TAG" "$VERSION" "$GITHUB_REPOSITORY" <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const [dir, tag, version, repo] = process.argv.slice(2);
          const latestPath = path.join(dir, "latest.json");
          let manifest = {
            version,
            notes: `VelvetMotion Desktop ${tag}`,
            pub_date: new Date().toISOString(),
            platforms: {},
          };
          if (fs.existsSync(latestPath)) {
            try {
              const existing = JSON.parse(fs.readFileSync(latestPath, "utf8"));
              if (existing && typeof existing === "object") {
                manifest = { ...manifest, ...existing, version, platforms: { ...(existing.platforms || {}) } };
              }
            } catch {}
          }
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}/`;
          const candidates = [
            ["windows-x86_64", `VelvetMotion.AI_${version}_x64-setup.exe`],
            ["windows-x86_64", `VelvetMotion.AI_${version}_x64_en-US.msi`],
            ["darwin-aarch64", "VelvetMotion.AI_aarch64.app.tar.gz"],
            ["darwin-x86_64", "VelvetMotion.AI_x64.app.tar.gz"],
            ["linux-x86_64", `VelvetMotion.AI_${version}_amd64.AppImage`],
          ];
          for (const [platform, assetName] of candidates) {
            const sigFile = path.join(dir, `${assetName}.sig`);
            if (!manifest.platforms[platform] && fs.existsSync(sigFile)) {
              const signature = fs.readFileSync(sigFile, "utf8").trim();
              if (signature.length >= 50) {
                manifest.platforms[platform] = {
                  signature,
                  url: `${baseUrl}${assetName}`,
                };
              }
            }
          }
          fs.writeFileSync(latestPath, JSON.stringify(manifest, null, 2) + "\n");
          EOF
          gh release upload "$TAG" "$TMP_DIR/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify complete installers and signed manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          # The draft release is not visible to updater clients. Verify all four
          # platforms BEFORE making it the public "latest" release.
          # GitHub release assets can lag a successful tauri-action upload.
          # Poll up to three minutes, but never publish unless every installer
          # (and all signatures when enabled) is actually present on this draft.
          node scripts/verify-desktop-release-with-retry.mjs

      - name: Publish release only after ALL four operating systems succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Desktop release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Assets: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
