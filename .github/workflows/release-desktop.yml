name: Release Hybrid Desktop App (Tauri v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (defaults to daily vYYYY.MM.DD)'
        required: false
        default: ''
  # Uncomment below for automated daily desktop builds at 06:00 UTC
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies & build out/
        run: |
          npm ci
          npm run audit:companions
          npm run build

      - name: Determine release tag & signing flags
        id: meta
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT
          fi
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          else
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.nosign.json
            echo "extra_args=--config src-tauri/tauri.nosign.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri Bundles & Updater Manifest (latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: 'VelvetMotion Desktop ${{ steps.meta.outputs.tag }}'
          releaseBody: 'Hybrid Tauri v2 release with Local Ultra RAM/GPU detection, Boss-Key stealth (CmdOrCtrl+Shift+H), and two-layer daily auto-updates.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: ${{ matrix.args }} ${{ steps.meta.outputs.extra_args }}
