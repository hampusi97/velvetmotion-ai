name: Release Hybrid Desktop App (Tauri v2)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'src-tauri/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.5; defaults to patch bump on main push)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute deterministic release tag & semver
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            BASE=$(node -e "const p=require('./src-tauri/tauri.conf.json'); const a=String(p.version||'1.0.0').split('.').map(Number); console.log(a[0]+'.'+a[1]+'.'+(a[2]+${{ github.run_number }}))")
            TAG="v${BASE}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies, sync version & build out/
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund
          if [[ "${{ needs.prepare.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node scripts/bump-version.mjs "${{ needs.prepare.outputs.version }}"
          fi
          npm run audit:companions
          npm run build

      - name: Build Tauri Bundles & Updater Manifest (latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'VelvetMotion Desktop ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'Native VelvetMotion Private Atelier desktop release. Includes the bundled interface, opt-in local AI connection diagnostics, and manual installer updates through official GitHub Releases. AI model weights are not bundled.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

