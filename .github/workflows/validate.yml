name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run audit:companions
      - run: node --check scripts/setup-signing.mjs
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile companion flows
        run: npm run test:e2e
      - name: Save browser checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-browser-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 7
