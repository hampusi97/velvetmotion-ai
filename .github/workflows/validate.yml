name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node --test scripts/verify-desktop-release.test.mjs
      - run: npx tsx --test lib/storyboard.test.ts
      - run: npx tsx --test lib/mediaGenerator.test.ts
      - run: npx tsx --test lib/canvasVideoExporter.test.ts
      - run: npx tsx --test lib/characterCardV2.test.ts
      - run: npx tsx --test lib/pngCardDecode.test.ts
      - run: npx tsx --test lib/sillyTavernImport.test.ts
      - run: npx tsx --test lib/memoryTiers.test.ts
      - run: npx tsx --test lib/lorebook.test.ts
      - run: npx tsx --test lib/comfyClient.test.ts
      - run: node --check scripts/setup-signing.mjs
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
