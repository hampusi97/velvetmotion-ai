name: Production Uptime & Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  health-check:
    name: Verify Cloudflare production health and current main commit
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      # Scheduled jobs can wait in the Actions queue while main advances.
      # Fetch current main instead of checking the stale event SHA.
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify actual public production metadata
        env:
          VERIFIED_PROVIDER: workers
          WORKERS_PRODUCTION_URL: https://velvetmotion-ai.hampusi97.workers.dev
          PAGES_PRODUCTION_URL: https://velvetmotion-ai-git.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/verify-cloudflare-public-commit.mjs

      - name: Verify public home page is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --max-time 15 --retry 2 --retry-delay 3 \
            --output /dev/null "https://velvetmotion-ai.hampusi97.workers.dev/"

      - name: Record current main health result
        shell: bash
        run: |
          echo "### Cloudflare production monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical site: https://velvetmotion-ai.hampusi97.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified latest checked-out main commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Both public build metadata and the home page were reachable." >> "$GITHUB_STEP_SUMMARY"
